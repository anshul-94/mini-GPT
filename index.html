<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Xai Assistant</title>
    <meta name="description" content="Multi-Modal RAG AI Assistant. Upload PDFs, CSVs, Excel, WhatsApp chats, images and ask questions about them.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           DESIGN TOKENS
        ============================================================ */
        :root {
            --bg-main: #020817;
            --sidebar-bg: #0F172A;
            --sidebar-hover: #1E293B;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --accent: #22C55E;
            --accent-hover: #16a34a;
            --input-bg: #0F172A;
            --input-border: #1E293B;
            --input-focus: rgba(34, 197, 94, 0.2);
            --bubble-user: #1E293B;
            --bubble-bot: #0F172A;
            --bubble-border: #1E293B;
            --sidebar-width: 260px;
            --radius-md: 12px;
            --radius-lg: 14px;
            --radius-bubble: 18px;
            --transition: all 0.2s ease;
        }

        /* ============================================================
           RESET
        ============================================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ============================================================
           BASE LAYOUT  —  full-height flex row
        ============================================================ */
        html {
            height: 100%;
            /* dvh tracks the visual viewport (shrinks when mobile keyboard opens) */
            height: 100dvh;
            overflow: hidden; /* html clips; body itself must NOT be overflow:hidden */
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100%;
            /* ROOT FIX: Do NOT use overflow:hidden on body.
               It traps the layout when the mobile keyboard shrinks the viewport,
               making the input bar disappear below the visible area. */
            overflow: visible;
            max-width: 100vw;
            /* Only transition color/background, never geometry — avoids
               layout-thrashing transitions that break keyboard-open reflows */
            transition: background 0.2s ease, color 0.2s ease;
        }

        /* ============================================================
           SIDEBAR
        ============================================================ */
        #sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--bubble-border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            padding: 16px;
            z-index: 200;
            overflow: hidden;
            /* ROOT FIX: No transition at base level — mobile uses a specific
               left-property transition set in the media query. Using
               transition:all here breaks the keyboard-open reflow on Android. */
            transition: none;
        }

        .app-name {
            font-size: 18px;
            margin-bottom: 24px;
            padding: 0 12px;
        }
        .brand-logo {
            font-size: inherit;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .brand-xai {
            color: var(--accent);
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
            font-weight: 800;
        }
        .brand-assistant {
            color: var(--text-primary);
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--bubble-border);
            background-color: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            transition: var(--transition);
            margin-bottom: 24px;
            width: 100%;
            /* large enough tap target on mobile */
            min-height: 44px;
        }

        .new-chat-btn:hover {
            background-color: var(--sidebar-hover);
            border-color: var(--text-secondary);
            transform: translateY(-1px);
        }

        .history-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 8px 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            /* keep it from wrapping */
            white-space: nowrap;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            margin-top: 8px;
            /* thin custom scrollbar */
            scrollbar-width: thin;
            scrollbar-color: var(--bubble-border) transparent;
        }

        #chat-history::-webkit-scrollbar { width: 4px; }
        #chat-history::-webkit-scrollbar-track { background: transparent; }
        #chat-history::-webkit-scrollbar-thumb {
            background-color: var(--bubble-border);
            border-radius: 4px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            /* clip long titles cleanly */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: var(--transition);
            margin-bottom: 4px;
            /* comfortable tap target */
            min-height: 40px;
            display: flex;
            align-items: center;
        }

        .history-item:hover {
            background-color: var(--sidebar-hover);
            color: var(--text-primary);
            transform: translateX(4px);
        }

        .history-item.active {
            background-color: var(--sidebar-hover);
            color: var(--text-primary);
            border: 1px solid var(--bubble-border);
        }

        /* ============================================================
           SIDEBAR OVERLAY  (darkens main area when sidebar is open on mobile)
        ============================================================ */
        #sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 150;
            /* fade-in animation */
            opacity: 0;
            transition: opacity 0.25s ease;
            /* FIX: invisible overlay must NOT intercept touch/click events.
               Without this, the transparent overlay covers the entire screen
               on mobile (display:block is forced by the media query) and
               swallows every tap before the textarea can receive focus. */
            pointer-events: none;
        }

        #sidebar-overlay.visible {
            opacity: 1;
            /* FIX: only intercept events when the overlay is actually visible */
            pointer-events: auto;
        }

        /* ============================================================
           MAIN CONTENT AREA
        ============================================================ */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            min-width: 0;
            /* ROOT FIX: overflow:hidden here clips the input area on Android
               when the keyboard opens. Use overflow:clip (no scroll) instead,
               which clips but does not create a scroll container. */
            overflow: clip;
            /* Fallback for browsers without overflow:clip */
            overflow: hidden;
        }
        @supports (overflow: clip) {
            #main-content { overflow: clip; }
        }

        /* ============================================================
           WELCOME SCREEN
        ============================================================ */
        #welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .welcome-title {
            font-size: clamp(22px, 4vw, 36px);
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
            letter-spacing: -1px;
        }

        .welcome-sub {
            font-size: clamp(14px, 2vw, 16px);
            color: var(--text-secondary);
            max-width: 400px;
            line-height: 1.5;
        }

        .welcome-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 32px;
            max-width: 600px;
            width: 100%;
        }

        .welcome-card {
            background-color: var(--sidebar-bg);
            border: 1px solid var(--bubble-border);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .welcome-card:hover {
            background-color: var(--sidebar-hover);
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .welcome-card-icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .welcome-card-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* ============================================================
           CHAT MESSAGES AREA
        ============================================================ */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 32px 0;
            display: none;
            /* thin custom scrollbar */
            scrollbar-width: thin;
            scrollbar-color: var(--bubble-border) transparent;
        }

        #chat-container::-webkit-scrollbar { width: 4px; }
        #chat-container::-webkit-scrollbar-track { background: transparent; }
        #chat-container::-webkit-scrollbar-thumb {
            background-color: var(--bubble-border);
            border-radius: 4px;
        }

        #messages {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ============================================================
           MESSAGE ROWS
        ============================================================ */
        .message {
            display: flex;
            gap: 14px;
            /* clamp gap on small screens */
            animation: fadeIn 0.35s ease forwards;
            /* never overflow horizontally */
            min-width: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0);   }
        }

        .message .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 11px;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .message.bot .avatar  { background-color: var(--accent);  color: #052e16; }
        .message.user .avatar { background-color: #334155; color: #f1f5f9;  }

        .message.user { flex-direction: row-reverse; }

        .msg-content {
            /* allow shrink — critical so bubbles don't overflow viewport */
            min-width: 0;
            max-width: 80%;
            line-height: 1.6;
            font-size: 15px;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: var(--radius-bubble);
            border: 1px solid var(--bubble-border);
            transition: var(--transition);
            /* always wrap, never overflow */
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .bubble:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .message.user .bubble {
            background-color: var(--bubble-user);
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
        }

        .message.bot .bubble {
            background-color: var(--bubble-bot);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        /* Code blocks inside bubbles — scrollable horizontally, clipped vertically */
        .bubble pre {
            overflow-x: auto;
            max-width: 100%;
            /* enable touch-scroll on iOS */
            -webkit-overflow-scrolling: touch;
        }

        /* ============================================================
           TYPING INDICATOR
        ============================================================ */
        #typing {
            display: none;
            padding: 8px 24px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            color: var(--text-secondary);
            font-size: 13px;
            font-style: italic;
        }

        /* ============================================================
           INPUT AREA
        ============================================================ */
        #input-area {
            /* never shrink — stays pinned at bottom */
            flex-shrink: 0;
            padding: 16px 24px;
            /* safe-area bottom for iPhone notch / home indicator */
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            background: linear-gradient(to top, var(--sidebar-bg) 60%, transparent);
            /* FIX: z-index must be ABOVE the sidebar-overlay (z-index:150) so
               the input area is never covered by the overlay on mobile.
               Previously z-index:10 allowed the overlay to sit on top and
               block all taps on the textarea. */
            position: relative;
            z-index: 160;
        }

        .input-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-lg);
            padding: 10px 14px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            transition: var(--transition);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .input-container:hover,
        .input-container:focus-within {
            border-color: var(--text-secondary);
            box-shadow: 0 0 0 1px var(--input-focus), 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        textarea {
            flex: 1;
            /* prevent textarea from breaking the flex row */
            min-width: 0;
            background: none;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            resize: none;
            max-height: 160px;
            min-height: 24px;
            outline: none;
            padding: 4px 0;
            line-height: 1.5;
            /* prevent iOS auto-zoom (font < 16px triggers zoom) */
            font-size: max(16px, 15px);
            /* FIX: eliminates the 300ms tap delay on iOS Safari and Android Chrome
               so the tap-to-focus is instantaneous. */
            touch-action: manipulation;
            /* FIX: ensure the element is always interactable */
            -webkit-user-select: text;
            user-select: text;
        }

        textarea::placeholder { color: var(--text-secondary); }

        textarea:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #send-btn {
            flex-shrink: 0;
            background-color: var(--accent);
            color: #052e16;
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            /* ROOT FIX: Only transition opacity/transform, NEVER pointer-events.
               Transitioning pointer-events causes Safari/Android to miss taps
               during the transition animation frame. */
            transition: opacity 0.2s ease, transform 0.15s ease, background-color 0.2s ease;
            opacity: 0.3;
            pointer-events: none;
            /* ROOT FIX: touch-action:manipulation eliminates the 300ms
               tap-delay on Android Chrome and iOS Safari without needing
               a JS touchstart handler. */
            touch-action: manipulation;
            /* Ensure button is always above any overlay within input area */
            position: relative;
            z-index: 1;
        }

        #send-btn.active            { opacity: 1; pointer-events: auto; }
        #send-btn.active:hover      { background-color: var(--accent-hover); transform: scale(1.05); }

        /* ============================================================
           ICONS
        ============================================================ */
        svg {
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ============================================================
           MOBILE HAMBURGER TOGGLE & HEADER
        ============================================================ */
        .mobile-header {
            display: none;
        }

        .menu-toggle {
            display: none;
            background-color: var(--bubble-user);
            border: 1px solid var(--bubble-border);
            color: var(--text-primary);
            border-radius: 8px;
            width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 300;
            transition: var(--transition);
            /* accessible touch target */
            touch-action: manipulation;
        }

        .menu-toggle:hover { background-color: var(--sidebar-hover); }

        /* ============================================================
           BREAKPOINT: LARGE DESKTOP  ≥ 1280px
           Centre the chat and cap bubble width comfortably.
        ============================================================ */
        @media (min-width: 1280px) {
            #messages {
                max-width: 860px;
                gap: 28px;
            }
            .msg-content { max-width: 75%; }
        }

        /* ============================================================
           BREAKPOINT: TABLET  769px – 1024px
        ============================================================ */
        @media (max-width: 1024px) and (min-width: 769px) {
            :root { --sidebar-width: 220px; }

            #messages {
                padding: 0 20px;
                gap: 20px;
            }

            .msg-content {
                max-width: 82%;
                font-size: 14px;
            }

            .welcome-title { font-size: 28px; }

            #input-area { padding: 14px 16px; }
        }

        /* ============================================================
           BREAKPOINT: MOBILE  ≤ 768px
        ============================================================ */
        @media (max-width: 768px) {
            /* Show mobile header and hamburger */
            .mobile-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                height: 56px;
                background-color: var(--sidebar-bg);
                border-bottom: 1px solid var(--bubble-border);
                padding: 0 16px;
                position: sticky;
                top: 0;
                z-index: 100;
                flex-shrink: 0;
                width: 100%;
            }

            .header-title {
                font-size: 16px;
                font-weight: 600;
                color: var(--text-primary);
                text-align: center;
                flex: 1;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                margin: 0 12px;
            }

            .menu-toggle {
                display: flex;
                background-color: transparent;
                border: none;
                color: var(--text-secondary);
                width: 36px;
                height: 36px;
                align-items: center;
                justify-content: center;
                border-radius: 6px;
            }
            .menu-toggle:hover {
                background-color: var(--sidebar-hover);
                color: var(--text-primary);
            }

            .header-new-chat-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: transparent;
                border: none;
                color: var(--text-secondary);
                width: 36px;
                height: 36px;
                cursor: pointer;
                border-radius: 6px;
                transition: var(--transition);
                touch-action: manipulation;
            }
            .header-new-chat-btn:hover {
                background-color: var(--sidebar-hover);
                color: var(--text-primary);
            }

            /* ROOT FIX: Sidebar uses transform for slide animation.
               Height uses 100dvh to stay within visual viewport. */
            #sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                height: 100%;
                height: 100dvh;
                width: 80%;
                max-width: 320px;
                transform: translateX(-100%);
                visibility: hidden;
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                            visibility 0.3s linear;
                box-shadow: 10px 0 40px rgba(0, 0, 0, 0.6);
                padding-left: max(16px, env(safe-area-inset-left));
                pointer-events: none;
            }

            /* Open state */
            #sidebar.open {
                transform: translateX(0);
                visibility: visible;
                pointer-events: auto;
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                            visibility 0s linear;
            }

            /* Overlay visible on mobile */
            #sidebar-overlay {
                display: block;
                visibility: hidden;
                opacity: 0;
                transition: opacity 0.3s ease, visibility 0.3s linear;
            }
            #sidebar-overlay.visible {
                visibility: visible;
                opacity: 1;
                transition: opacity 0.3s ease, visibility 0s linear;
            }

            /* main-content layout on mobile */
            #main-content {
                padding-top: 0; /* Sticky mobile-header handles spacing */
                width: 100%;
                overflow: visible;
            }

            /* Welcome screen compact */
            .welcome-title { font-size: 24px; }
            .welcome-sub   { font-size: 14px; }

            /* ROOT FIX: #chat-container must be a proper scroll container
               with -webkit-overflow-scrolling for momentum scroll on iOS.
               Use flex:1 + min-height:0 so it shrinks when keyboard opens
               rather than pushing the input bar off screen. */
            #chat-container {
                padding: 16px 0;
                /* min-height:0 allows the flex child to shrink below its content size */
                min-height: 0;
                -webkit-overflow-scrolling: touch;
            }

            #messages {
                padding: 0 12px;
                gap: 16px;
            }

            .message       { gap: 10px; }
            .message .avatar {
                width: 28px;
                height: 28px;
                font-size: 10px;
            }
            .msg-content {
                max-width: 88%;
                font-size: 14px;
            }
            .bubble { padding: 10px 14px; }

            /* Input area: explicit bottom padding with safe-area */
            #input-area {
                padding: 10px 12px;
                padding-bottom: max(10px, env(safe-area-inset-bottom));
            }

            .input-container { margin: 0; }

            textarea { font-size: 16px; /* 16px prevents iOS auto-zoom */ }
        }

        /* ============================================================
           BREAKPOINT: SMALL MOBILE  ≤ 480px
        ============================================================ */
        @media (max-width: 480px) {
            .welcome-title  { font-size: 20px; letter-spacing: -0.5px; }
            .welcome-sub    { font-size: 13px; }

            #messages       { padding: 0 10px; gap: 14px; }

            .message        { gap: 8px; }
            .message .avatar {
                width: 26px;
                height: 26px;
                font-size: 9px;
                border-radius: 6px;
            }
            .msg-content    { max-width: 92%; font-size: 13.5px; }
            .bubble         { padding: 9px 12px; }

            #input-area     { padding: 8px 10px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
            #send-btn       { width: 34px; height: 34px; }

            /* Code blocks — scroll rather than overflow */
            .bubble pre {
                max-width: calc(100vw - 80px);
            }
        }

        /* ============================================================
           RAG UPLOAD UI STYLES
        ============================================================ */

        /* ── Upload button (paperclip) inside input bar ── */
        #upload-btn {
            flex-shrink: 0;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: var(--transition);
            touch-action: manipulation;
        }
        #upload-btn:hover { background-color: rgba(34,197,94,0.12); color: var(--accent); }
        #upload-btn.has-files { color: var(--accent); }

        /* ── File badges strip (shown above input bar when files are loaded) ── */
        #file-badges {
            display: none;
            max-width: 800px;
            width: 100%;
            margin: 0 auto 8px auto;
            display: none;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 2px;
        }
        #file-badges.visible { display: flex; }

        .file-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(34,197,94,0.12);
            border: 1px solid rgba(34,197,94,0.3);
            border-radius: 20px;
            padding: 4px 10px 4px 8px;
            font-size: 12px;
            color: #86efac;
            max-width: 200px;
            animation: badgeIn 0.25s ease;
        }
        @keyframes badgeIn {
            from { opacity: 0; transform: scale(0.85); }
            to   { opacity: 1; transform: scale(1); }
        }
        .file-badge-icon { font-size: 14px; }
        .file-badge-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }

        /* ── Upload progress bar ── */
        #upload-status {
            display: none;
            max-width: 800px;
            width: 100%;
            margin: 0 auto 8px auto;
            background: rgba(34,197,94,0.08);
            border: 1px solid rgba(34,197,94,0.2);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px;
            color: var(--text-secondary);
            align-items: center;
            gap: 10px;
        }
        #upload-status.visible { display: flex; }
        .upload-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(34,197,94,0.3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Analytics panel ── */
        #analytics-panel {
            display: none;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 0 24px;
        }
        #analytics-panel.visible { display: block; }

        .analytics-card {
            background-color: var(--sidebar-bg);
            border: 1px solid var(--bubble-border);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            margin-bottom: 16px;
            animation: fadeIn 0.4s ease;
        }
        .analytics-card.collapsed .analytics-body {
            display: none;
        }
        .analytics-card.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }
        .analytics-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            cursor: pointer;
            user-select: none;
        }
        .analytics-card.collapsed .analytics-header {
            margin-bottom: 0;
        }
        .collapse-icon {
            font-size: 12px;
            color: var(--text-secondary);
            transition: var(--transition);
            display: inline-block;
        }
        .analytics-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .analytics-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 4px;
            transition: var(--transition);
            z-index: 2;
        }
        .analytics-close:hover { color: var(--text-primary); background: rgba(255,255,255,0.08); }
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }
        .analytics-stat {
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            padding: 10px 12px;
            text-align: center;
        }
        .analytics-stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .analytics-stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 3px;
        }
        .analytics-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 8px;
        }
        .analytics-table th {
            text-align: left;
            color: var(--text-secondary);
            padding: 4px 8px;
            font-weight: 500;
            border-bottom: 1px solid var(--bubble-border);
        }
        .analytics-table td {
            padding: 4px 8px;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(31,41,55,0.5);
        }
        .analytics-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .analytics-chip {
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .analytics-chip span { color: var(--text-primary); font-weight: 600; }

        /* ── Drag-and-drop overlay ── */
        #drop-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(34,197,94,0.08);
            border: 2px dashed rgba(34,197,94,0.5);
            border-radius: 12px;
            z-index: 50;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }
        #drop-overlay.active {
            display: flex;
            pointer-events: auto;
        }
        .drop-icon { font-size: 40px; }
        .drop-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
        }
        .drop-sub {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ── Mobile analytics adjustments ── */
        @media (max-width: 768px) {
            #analytics-panel { padding: 0 12px; }
            .analytics-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <!-- Mobile sidebar backdrop overlay -->
    <div id="sidebar-overlay" aria-hidden="true"></div>

    <aside id="sidebar" role="navigation" aria-label="Chat sessions">
        <div class="app-name">
            <span class="brand-logo"><span class="brand-xai">Xai</span><span class="brand-assistant">Assistant</span></span>
        </div>
        <button type="button" class="new-chat-btn" id="new-chat-btn">
            <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            New Chat
        </button>
        <div class="history-label">History</div>
        <div id="chat-history"></div>
    </aside>

    <main id="main-content">
        <header class="mobile-header">
            <button id="menu-toggle" class="menu-toggle" aria-label="Toggle Sidebar">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="header-title"><span class="brand-logo"><span class="brand-xai">Xai</span><span class="brand-assistant">Assistant</span></span></div>
            <button id="header-new-chat-btn" class="header-new-chat-btn" aria-label="New Chat">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </header>
        


        



        <div id="welcome-screen">
            <h1 class="welcome-title">👋 Welcome</h1>
            <p class="welcome-sub">Ask questions about your files.</p>
            <div class="welcome-grid">
                <div class="welcome-card" onclick="document.getElementById('file-input').click()">
                    <div class="welcome-card-icon">📄</div>
                    <div class="welcome-card-title">Upload PDF</div>
                </div>
                <div class="welcome-card" onclick="document.getElementById('file-input').click()">
                    <div class="welcome-card-icon">📊</div>
                    <div class="welcome-card-title">Upload CSV / Excel</div>
                </div>
                <div class="welcome-card" onclick="document.getElementById('file-input').click()">
                    <div class="welcome-card-icon">🖼️</div>
                    <div class="welcome-card-title">Upload Image</div>
                </div>
                <div class="welcome-card" onclick="document.getElementById('file-input').click()">
                    <div class="welcome-card-icon">💬</div>
                    <div class="welcome-card-title">Upload WhatsApp</div>
                </div>
            </div>
        </div>

        <div id="chat-container">
            <div id="messages"></div>
            <div id="typing">AI is thinking...</div>
            <!-- Analytics panel (shown after structured file upload) -->
            <div id="analytics-panel"></div>
        </div>

        <!-- Drag-and-drop overlay (absolute-positioned over main-content) -->
        <div id="drop-overlay" role="presentation" aria-hidden="true">
            <div class="drop-icon">📂</div>
            <div class="drop-text">Drop your file here</div>
            <div class="drop-sub">PDF · CSV · Excel · DOCX · TXT · WhatsApp · Image</div>
        </div>

        <!-- Hidden file input -->
        <input type="file" id="file-input" style="display:none"
            accept=".pdf,.csv,.xlsx,.xls,.txt,.docx,.png,.jpg,.jpeg,.gif,.bmp,.webp,.tiff">

        <div id="input-area">
            <!-- Upload status bar -->
            <div id="upload-status">
                <div class="upload-spinner"></div>
                <span id="upload-status-text">Uploading and indexing file...</span>
            </div>
            <!-- File badges -->
            <div id="file-badges"></div>

            <div class="input-container">
                <!-- Paperclip upload button -->
                <button id="upload-btn" aria-label="Upload file" title="Upload PDF, CSV, Excel, DOCX, Image, WhatsApp chat...">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke-width="2"/></svg>
                </button>
                <textarea id="user-input" rows="1" placeholder="Ask anything, or upload a file first..." autocomplete="off" autocorrect="off" spellcheck="true"></textarea>
                <button id="send-btn" aria-label="Send message">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        'use strict';

        const S = {
            sessions: [],
            activeId: null
        };

        const $ = id => document.getElementById(id);
        const D = {
            history: $('chat-history'),
            welcome: $('welcome-screen'),
            chatContainer: $('chat-container'),
            messages: $('messages'),
            input: $('user-input'),
            sendBtn: $('send-btn'),
            newBtn: $('new-chat-btn'),
            typing: $('typing'),
            // RAG upload UI elements
            uploadBtn: $('upload-btn'),
            fileInput: $('file-input'),
            fileBadges: $('file-badges'),
            uploadStatus: $('upload-status'),
            uploadStatusText: $('upload-status-text'),
            analyticsPanel: $('analytics-panel'),
            dropOverlay: $('drop-overlay')
        };

        /* --- UTILS --- */
        const uid = () => Math.random().toString(36).slice(2, 9);
        
        function scrollBottom() {
            // ROOT FIX: scrollIntoView on the last child is more reliable than
            // scrollTop = scrollHeight on iOS Safari, especially when the keyboard
            // is opening simultaneously. Falls back to scrollTop if no children.
            setTimeout(() => {
                const lastMsg = D.messages.lastElementChild;
                if (lastMsg) {
                    lastMsg.scrollIntoView({ block: 'end', behavior: 'auto' });
                } else {
                    D.chatContainer.scrollTop = D.chatContainer.scrollHeight;
                }
            }, 60);
        }

        const getApiUrl = () => {
            if (window.location.origin && window.location.origin !== 'null' && window.location.protocol.startsWith('http')) {
                return `${window.location.origin}/chat`;
            }
            return 'http://localhost:8000/chat';
        };

        function formatMarkdown(text) {
            // Escape HTML for XSS prevention
            let html = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

            // Code blocks
            html = html.replace(/```([\s\S]*?)```/g, (match, p1) => {
                const lines = p1.split('\n');
                let code = p1;
                let lang = '';
                if (lines.length > 0 && !lines[0].includes(' ') && lines[0].trim().length < 15) {
                    lang = lines[0].trim();
                    code = lines.slice(1).join('\n');
                }
                return `<pre style="background: #090d16; padding: 12px; border-radius: 6px; overflow-x: auto; border: 1px solid var(--bubble-border); font-family: monospace; font-size: 13px; margin: 8px 0; color: #34d399;"><code class="${lang}">${code.trim()}</code></pre>`;
            });

            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code style="background: #090d16; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #34d399;">$1</code>');

            // Line breaks
            html = html.replace(/\n/g, '<br>');

            return html;
        }

        function updateInputState(loading) {
            if (loading) {
                D.input.disabled = true;
                D.sendBtn.classList.remove('active');
                // ROOT FIX: clear any inline style so CSS class fully controls pointer-events.
                // An inline style.pointerEvents overrides the class and permanently blocks taps.
                D.sendBtn.style.removeProperty('pointer-events');
            } else {
                D.input.disabled = false;
                // ROOT FIX: Do NOT call D.input.focus() on mobile.
                // Programmatic focus() re-opens the keyboard unexpectedly on iOS/Android,
                // causing layout jumps. Only focus on desktop where it is safe.
                if (window.innerWidth > 768) {
                    D.input.focus();
                }
                const hasText = D.input.value.trim().length > 0;
                D.sendBtn.classList.toggle('active', hasText);
                // ROOT FIX: clear inline style, rely on .active class for pointer-events.
                D.sendBtn.style.removeProperty('pointer-events');
            }
        }

        /* --- SESSIONS --- */
        function newSession() {
            // BUG 1 FIX: Re-use current active session if it is empty.
            // Guard must also call renderHistory() to fix stale active-highlight (BUG 5).
            const activeSess = S.sessions.find(s => s.id === S.activeId);
            if (activeSess && activeSess.messages.length === 0 && !activeSess.isLoading) {
                D.input.value = '';
                D.input.style.height = 'auto';
                D.input.focus();
                D.sendBtn.classList.remove('active');
                renderHistory(); // BUG 5 FIX: ensure sidebar active-highlight is correct
                return;
            }

            const sess = { id: uid(), title: 'New Chat', messages: [], isLoading: false, uploadedFiles: [], analytics: [] };
            S.sessions.unshift(sess);

            // BUG 1 FIX: Set S.activeId atomically BEFORE activateSession so any
            // in-flight sendMessage() closures that re-check S.activeId see the correct value.
            S.activeId = sess.id;

            // Clear input box state cleanly
            D.input.value = '';
            D.input.style.height = 'auto';
            D.sendBtn.classList.remove('active');

            activateSession(sess.id);
        }

        function activateSession(id) {
            S.activeId = id;
            const sess = S.sessions.find(s => s.id === id);
            if (!sess) return;

            // BUG 6 FIX: Always clear the messages DOM before switching sessions
            // to prevent stale nodes from the previous session being visible.
            D.messages.innerHTML = '';

            if (sess.messages.length === 0) {
                D.welcome.style.display = 'flex';
                D.chatContainer.style.display = 'none';
            } else {
                D.welcome.style.display = 'none';
                D.chatContainer.style.display = 'block';
                renderMessages(sess.messages);
            }

            // Clear input box to avoid stale content leakage across sessions (BUG 4)
            D.input.value = '';
            D.input.style.height = 'auto';
            D.sendBtn.classList.remove('active');

            // Dynamic header title update
            const headerTitle = document.querySelector('.header-title');
            if (headerTitle) {
                headerTitle.innerHTML = sess.messages.length === 0 ? '<span class="brand-logo"><span class="brand-xai">Xai</span><span class="brand-assistant">Assistant</span></span>' : sess.title;
            }

            // Re-render file badges
            D.fileBadges.innerHTML = '';
            if (sess.uploadedFiles.length > 0) {
                sess.uploadedFiles.forEach(f => {
                    const badge = document.createElement('div');
                    badge.className = 'file-badge';
                    badge.title = f;
                    badge.innerHTML = `<span class="file-badge-icon">${getFileIcon(f)}</span><span class="file-badge-name">${f}</span>`;
                    D.fileBadges.appendChild(badge);
                });
                D.fileBadges.classList.add('visible');
                D.uploadBtn.classList.add('has-files');
            } else {
                D.fileBadges.classList.remove('visible');
                D.uploadBtn.classList.remove('has-files');
            }

            // Re-render analytics
            D.analyticsPanel.innerHTML = '';
            if (sess.analytics.length > 0) {
                sess.analytics.forEach(a => {
                    const card = createAnalyticsCard(a.data, a.fileName, true);
                    D.analyticsPanel.appendChild(card);
                });
                D.analyticsPanel.classList.add('visible');
            } else {
                D.analyticsPanel.classList.remove('visible');
            }

            D.typing.style.display = sess.isLoading ? 'block' : 'none';
            updateInputState(sess.isLoading);
            renderHistory();
        }

        function renderHistory() {
            D.history.innerHTML = '';
            S.sessions.forEach(s => {
                const el = document.createElement('div');
                el.className = `history-item ${s.id === S.activeId ? 'active' : ''}`;
                el.textContent = s.title;
                el.onclick = () => {
                    activateSession(s.id);
                    // ROOT FIX: call closeSidebar() (not classList.remove directly)
                    // so the overlay is also dismissed when selecting a history item.
                    if (window.innerWidth <= 768) {
                        closeSidebar();
                    }
                };
                D.history.appendChild(el);
            });
        }

        /* --- MESSAGES --- */
        function renderMessages(messages) {
            D.messages.innerHTML = '';
            messages.forEach(m => appendMessageUI(m));
            scrollBottom();
        }

        function appendMessageUI(m) {
            const msgRow = document.createElement('div');
            msgRow.className = `message ${m.role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = m.role === 'user' ? 'U' : 'AI';

            const content = document.createElement('div');
            content.className = 'msg-content';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            if (m.role === 'bot' && m.content.startsWith('Error:')) {
                // Render error messages beautifully using a reddish accent
                bubble.style.borderColor = '#ef4444';
                bubble.style.backgroundColor = '#180f15';
                bubble.innerHTML = `<span style="color: #f87171; font-weight: 500;">${formatMarkdown(m.content)}</span>`;
            } else {
                bubble.innerHTML = formatMarkdown(m.content);
            }

            content.appendChild(bubble);
            msgRow.appendChild(avatar);
            msgRow.appendChild(content);
            D.messages.appendChild(msgRow);
        }

        async function sendMessage() {
            const text = D.input.value.trim();
            if (!text) return;

            // BUG 1 FIX: Snapshot activeId at the START of this call.
            // All checks against the session must use this snapshot, not a live S.activeId,
            // so a concurrent newSession() cannot redirect this message to the wrong session.
            const sendingSessionId = S.activeId;
            const sess = S.sessions.find(s => s.id === sendingSessionId);
            if (!sess || sess.isLoading) return;

            // BUG 6 FIX: If this is the first message, show chat container BEFORE
            // appending to DOM. Also use renderMessages() to avoid double-render.
            const isFirstMessage = sess.messages.length === 0;
            if (isFirstMessage) {
                sess.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
                D.welcome.style.display = 'none';
                D.chatContainer.style.display = 'block';
                D.messages.innerHTML = ''; // clear stale DOM
                renderHistory(); // update sidebar title immediately
                const headerTitle = document.querySelector('.header-title');
                if (headerTitle) {
                    headerTitle.textContent = sess.title;
                }
            }

            const uMsg = { role: 'user', content: text };
            sess.messages.push(uMsg);

            // Only update DOM if this session is still active
            if (S.activeId === sendingSessionId) {
                appendMessageUI(uMsg);
            }

            D.input.value = '';
            D.input.style.height = 'auto';
            D.sendBtn.classList.remove('active');

            sess.isLoading = true;
            if (S.activeId === sendingSessionId) {
                D.typing.style.display = 'block';
                updateInputState(true);
                scrollBottom();
            }

            try {
                const response = await fetch(getApiUrl(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        session_id: sess.id  // always use sess.id, not S.activeId
                    })
                });

                if (!response.ok) {
                    const errRes = await response.json().catch(() => ({}));
                    throw new Error(errRes.detail || `Server returned status ${response.status}`);
                }

                const data = await response.json();
                const replyText = data.reply || "I'm sorry, I couldn't process that.";
                const bMsg = { role: 'bot', content: replyText };
                sess.messages.push(bMsg);

                // BUG 6 FIX: Only update DOM if the user hasn't switched away.
                // If they switched away and back, activateSession already rendered the history.
                if (S.activeId === sendingSessionId) {
                    D.typing.style.display = 'none';
                    appendMessageUI(bMsg);
                    scrollBottom();
                }
            } catch (e) {
                const errorText = e.message || "Error connecting to server. Please ensure the backend is running.";
                const eMsg = { role: 'bot', content: `Error: ${errorText}` };
                sess.messages.push(eMsg);

                if (S.activeId === sendingSessionId) {
                    D.typing.style.display = 'none';
                    appendMessageUI(eMsg);
                    scrollBottom();
                }
            } finally {
                sess.isLoading = false;
                if (S.activeId === sendingSessionId) {
                    updateInputState(false);
                }
            }
        }

        /* --- LISTENERS --- */
        D.input.oninput = () => {
            D.input.style.height = 'auto';
            // cap matches CSS max-height: 160px
            D.input.style.height = Math.min(D.input.scrollHeight, 160) + 'px';
            const hasText = D.input.value.trim().length > 0;
            D.sendBtn.classList.toggle('active', hasText);
            // ROOT FIX: rely on CSS .active class for pointer-events, not inline style.
            D.sendBtn.style.removeProperty('pointer-events');
        };

        D.input.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        };

        D.sendBtn.onclick = sendMessage;
        D.newBtn.onclick = () => {
            newSession();
            if (window.innerWidth <= 768) {
                closeSidebar();
            }
        };
        const headerNewBtn = $('header-new-chat-btn');
        if (headerNewBtn) {
            headerNewBtn.onclick = () => {
                newSession();
                if (window.innerWidth <= 768) {
                    closeSidebar();
                }
            };
        }

        // ── Sidebar helpers (MOBILE SIDEBAR BUG FIX) ───────────────────
        // When the sidebar is closed, visibility:hidden + pointer-events:none
        // ensure it never sits in the hit-test tree and blocks the input box.
        // We add/remove the .open class which toggles those properties via CSS.
        // ────────────────────────────────────────────────────────────────────
        function openSidebar() {
            const sidebar = $('sidebar');
            const overlay = $('sidebar-overlay');
            sidebar.classList.add('open');
            overlay.classList.add('visible');
        }

        function closeSidebar() {
            const sidebar = $('sidebar');
            const overlay = $('sidebar-overlay');
            sidebar.classList.remove('open');
            overlay.classList.remove('visible');
        }

        // Mobile hamburger toggle
        $('menu-toggle').onclick = (e) => {
            e.stopPropagation();
            const isOpen = $('sidebar').classList.contains('open');
            isOpen ? closeSidebar() : openSidebar();
        };

        // Overlay: close on both click and touchstart for instant iOS response
        const overlayEl = $('sidebar-overlay');
        overlayEl.addEventListener('click',      () => closeSidebar());
        overlayEl.addEventListener('touchstart', () => closeSidebar(), { passive: true });

        // Document-level handler: close sidebar when tapping outside of it.
        // Explicitly excludes #input-area so tapping the textarea never
        // triggers closeSidebar and swallows the focus event.
        document.addEventListener('click', (e) => {
            if (window.innerWidth > 768) return;        // not needed on desktop
            if (!$('sidebar').classList.contains('open')) return; // already closed
            const sidebar   = $('sidebar');
            const toggle    = $('menu-toggle');
            const inputArea = $('input-area');

            // Never close when the user taps the input area
            if (inputArea && inputArea.contains(e.target)) return;

            // Close if tap landed outside sidebar + toggle
            if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                closeSidebar();
            }
        });

        // ROOT FIX: Visual Viewport API for iOS Safari keyboard handling.
        // window.resize does NOT fire when the iOS keyboard opens.
        // visualViewport.resize DOES. We use it to scroll the last message
        // into view so it's not hidden behind the keyboard.
        if (window.visualViewport) {
            let lastVH = window.visualViewport.height;
            window.visualViewport.addEventListener('resize', () => {
                const newVH = window.visualViewport.height;
                const keyboardOpened = newVH < lastVH - 50; // threshold: 50px
                lastVH = newVH;
                if (keyboardOpened) {
                    // Keyboard just opened — scroll to bottom so input stays visible
                    setTimeout(scrollBottom, 100);
                }
            });
        }

        /* ─────────────────────────────────────────────────────────────────
           RAG FILE UPLOAD — COMPLETE IMPLEMENTATION
        ───────────────────────────────────────────────────────────────── */

        // File type icon mapping
        const FILE_ICONS = {
            'pdf': '📄', 'csv': '📊', 'xlsx': '📊', 'xls': '📊',
            'txt': '📝', 'docx': '📝', 'doc': '📝',
            'png': '🖼️', 'jpg': '🖼️', 'jpeg': '🖼️',
            'gif': '🖼️', 'bmp': '🖼️', 'webp': '🖼️', 'tiff': '🖼️'
        };

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            return FILE_ICONS[ext] || '📎';
        }

        function getUploadApiUrl() {
            const origin = window.location.origin;
            if (origin && origin !== 'null' && window.location.protocol.startsWith('http')) {
                return `${origin}/upload`;
            }
            return 'http://localhost:8000/upload';
        }

        // Set upload button loading state
        function setUploadLoading(loading, statusText = 'Uploading and indexing file...') {
            if (loading) {
                D.uploadBtn.disabled = true;
                D.uploadBtn.style.opacity = '0.4';
                D.uploadStatus.classList.add('visible');
                D.uploadStatusText.textContent = statusText;
            } else {
                D.uploadBtn.disabled = false;
                D.uploadBtn.style.opacity = '';
                D.uploadStatus.classList.remove('visible');
            }
        }

        // Add a file badge to the strip
        function addFileBadge(filename) {
            const existing = Array.from(D.fileBadges.children).find(b => b.title === filename);
            if (existing) return;

            const badge = document.createElement('div');
            badge.className = 'file-badge';
            badge.title = filename;
            const icon = document.createElement('span');
            icon.className = 'file-badge-icon';
            icon.textContent = getFileIcon(filename);
            const name = document.createElement('span');
            name.className = 'file-badge-name';
            name.textContent = filename;
            badge.appendChild(icon);
            badge.appendChild(name);
            D.fileBadges.appendChild(badge);
            D.fileBadges.classList.add('visible');
            D.uploadBtn.classList.add('has-files');
        }

        // Create analytics card element from API response
        function createAnalyticsCard(analytics, fileName, collapsed = false) {
            if (!analytics || Object.keys(analytics).length === 0) {
                return null;
            }

            const type = analytics.type;
            const card = document.createElement('div');
            card.className = `analytics-card ${collapsed ? 'collapsed' : ''}`;
            card.id = `analytics-${Date.now()}`;

            let headerIcon = '📊';
            let headerTitle = 'File Analytics';
            if (type === 'whatsapp') { headerIcon = '💬'; headerTitle = 'WhatsApp Chat Analytics'; }
            else if (type === 'excel') { headerIcon = '📊'; headerTitle = 'Excel Analytics'; }
            else if (type === 'tabular') { headerIcon = '📊'; headerTitle = 'CSV Analytics'; }
            else if (type === 'document') { headerIcon = '🧠'; headerTitle = 'File Intelligence'; }

            card.innerHTML = `
                <div class="analytics-header" onclick="this.parentElement.classList.toggle('collapsed')">
                    <div class="analytics-title">${headerIcon} ${headerTitle} — ${fileName}</div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="collapse-icon">▼</span>
                        <button class="analytics-close" onclick="event.stopPropagation(); this.closest('.analytics-card').remove()" title="Dismiss">×</button>
                    </div>
                </div>
                <div class="analytics-body" style="margin-top: 12px;"></div>
            `;

            const body = card.querySelector('.analytics-body');

            if (type === 'whatsapp') {
                const msgs = analytics.total_messages || 0;
                const participants = analytics.participants || [];
                const mostActive = analytics.most_active || ['N/A', 0];
                const keywordCounts = analytics.keyword_counts || {};
                const topEmojis = analytics.top_emojis || [];
                const topWords = analytics.top_words || [];

                body.innerHTML = `
                    <div class="analytics-grid">
                        <div class="analytics-stat">
                            <div class="analytics-stat-value">${msgs.toLocaleString()}</div>
                            <div class="analytics-stat-label">Total Messages</div>
                        </div>
                        <div class="analytics-stat">
                            <div class="analytics-stat-value">${participants.length}</div>
                            <div class="analytics-stat-label">Participants</div>
                        </div>
                        <div class="analytics-stat">
                            <div class="analytics-stat-value" style="font-size:14px">${mostActive[0]}</div>
                            <div class="analytics-stat-label">Most Active (${mostActive[1]} msgs)</div>
                        </div>
                        <div class="analytics-stat">
                            <div class="analytics-stat-value">${keywordCounts['sorry'] || 0}</div>
                            <div class="analytics-stat-label">"sorry" said</div>
                        </div>
                    </div>
                    ${topWords.length ? `
                    <div style="margin-top:12px;font-size:12px;color:var(--text-secondary);margin-bottom:6px;">Top Words</div>
                    <div class="analytics-chips">
                        ${topWords.slice(0,8).map(([w,c]) => `<div class="analytics-chip">${w} <span>${c}</span></div>`).join('')}
                    </div>` : ''}
                    ${topEmojis.length ? `
                    <div style="margin-top:10px;font-size:12px;color:var(--text-secondary);margin-bottom:6px;">Top Emojis</div>
                    <div class="analytics-chips">
                        ${topEmojis.slice(0,6).map(([e,c]) => `<div class="analytics-chip">${e} <span>${c}</span></div>`).join('')}
                    </div>` : ''}
                `;
            } else if (type === 'tabular' || type === 'excel') {
                const rows = analytics.total_rows || analytics.rows || 0;
                const cols = analytics.columns || [];
                const numStats = analytics.numeric_stats || {};
                const sheetNames = analytics.sheet_names || [];

                const statsRows = Object.entries(numStats).slice(0, 6).map(([col, s]) =>
                    `<tr><td>${col}</td><td>${s.min != null ? s.min.toFixed(1) : '-'}</td><td>${s.max != null ? s.max.toFixed(1) : '-'}</td><td>${s.mean != null ? s.mean.toFixed(1) : '-'}</td><td>${s.sum != null ? s.sum.toFixed(0) : '-'}</td></tr>`
                ).join('');

                body.innerHTML = `
                    <div class="analytics-grid">
                        <div class="analytics-stat">
                            <div class="analytics-stat-value">${rows.toLocaleString()}</div>
                            <div class="analytics-stat-label">Rows</div>
                        </div>
                        <div class="analytics-stat">
                            <div class="analytics-stat-value">${cols.length}</div>
                            <div class="analytics-stat-label">Columns</div>
                        </div>
                        ${sheetNames.length > 1 ? `<div class="analytics-stat"><div class="analytics-stat-value">${sheetNames.length}</div><div class="analytics-stat-label">Sheets</div></div>` : ''}
                    </div>
                    <div style="margin-top:10px;font-size:12px;color:var(--text-secondary);margin-bottom:6px;">Columns: ${cols.slice(0,8).join(', ')}${cols.length > 8 ? '...' : ''}</div>
                    ${statsRows ? `
                    <table class="analytics-table">
                        <thead><tr><th>Column</th><th>Min</th><th>Max</th><th>Avg</th><th>Sum</th></tr></thead>
                        <tbody>${statsRows}</tbody>
                    </table>` : ''}
                `;
            } else if (type === 'document') {
                const summary = analytics.summary || '';
                const topics = analytics.topics || [];
                const entities = analytics.entities || [];
                body.innerHTML = `
                    <div style="font-size:13px; line-height:1.5; color:var(--text-primary); margin-bottom:12px;">${summary}</div>
                    ${topics.length ? `
                    <div style="font-size:12px; color:var(--text-secondary); margin-bottom:6px;">Key Topics</div>
                    <div class="analytics-chips" style="margin-bottom:12px;">
                        ${topics.map(t => `<div class="analytics-chip">${t}</div>`).join('')}
                    </div>` : ''}
                    ${entities.length ? `
                    <div style="font-size:12px; color:var(--text-secondary); margin-bottom:6px;">Important Entities</div>
                    <div class="analytics-chips">
                        ${entities.map(e => `<div class="analytics-chip">${e}</div>`).join('')}
                    </div>` : ''}
                `;
            } else {
                body.innerHTML = `<div style="color:var(--text-secondary);font-size:13px;">File indexed. Ask your questions below.</div>`;
            }

            return card;
        }

        // Core upload function
        async function uploadFile(file) {
            const sess = S.sessions.find(s => s.id === S.activeId);
            if (!sess) return;

            const MAX_SIZE = 50 * 1024 * 1024;
            if (file.size > MAX_SIZE) {
                appendSystemMessage(`❌ File too large: ${file.name} (${(file.size/1024/1024).toFixed(1)} MB). Maximum is 50 MB.`);
                return;
            }

            const allowedExts = ['pdf','csv','xlsx','xls','txt','docx','png','jpg','jpeg','gif','bmp','webp','tiff'];
            const ext = file.name.split('.').pop().toLowerCase();
            if (!allowedExts.includes(ext)) {
                appendSystemMessage(`❌ Unsupported file type: .${ext}`);
                return;
            }

            setUploadLoading(true, `Processing ${file.name}...`);

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('session_id', sess.id);

                const response = await fetch(getUploadApiUrl(), {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || `Upload failed (${response.status})`);
                }

                // Show file badge
                if (!sess.uploadedFiles.includes(file.name)) {
                    sess.uploadedFiles.push(file.name);
                    if (S.activeId === sess.id) {
                        addFileBadge(file.name);
                    }
                }

                // Show analytics panel
                if (data.analytics) {
                    sess.analytics.push({ data: data.analytics, fileName: file.name });
                    if (S.activeId === sess.id) {
                        const card = createAnalyticsCard(data.analytics, file.name);
                        if (card) {
                            D.analyticsPanel.appendChild(card);
                            D.analyticsPanel.classList.add('visible');
                            
                            // Show chat container if welcome screen was showing
                            D.welcome.style.display = 'none';
                            D.chatContainer.style.display = 'block';
                            scrollBottom();
                        }
                    }
                }

                // Show success message in chat
                appendSystemMessage(
                    `✅ **${file.name}** uploaded successfully!\n` +
                    `Type: ${data.file_type} · Chunks indexed: ${data.chunks_indexed}\n` +
                    `You can now ask questions about this file.`
                );

                // Update session title if first message
                if (sess.messages.length <= 1) {
                    sess.title = `📎 ${file.name}`;
                    renderHistory();
                    const headerTitle = document.querySelector('.header-title');
                    if (headerTitle) headerTitle.textContent = sess.title;
                }

            } catch (err) {
                appendSystemMessage(`❌ Upload failed: ${err.message}`);
            } finally {
                setUploadLoading(false);
                D.fileInput.value = '';
            }
        }

        // Append a system/status message to chat (not a user or bot message)
        function appendSystemMessage(text) {
            const sess = S.sessions.find(s => s.id === S.activeId);
            if (!sess) return;

            D.welcome.style.display = 'none';
            D.chatContainer.style.display = 'block';

            const msgRow = document.createElement('div');
            msgRow.className = 'message bot';
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = 'AI';
            const content = document.createElement('div');
            content.className = 'msg-content';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.style.borderColor = 'rgba(34,197,94,0.3)';
            bubble.style.backgroundColor = 'rgba(34,197,94,0.05)';

            // Convert simple **bold** and \n to HTML
            const formatted = text
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/\*\*(.+?)\*\*/g, '<strong style="color:#86efac">$1</strong>')
                .replace(/\n/g, '<br>');
            bubble.innerHTML = formatted;

            content.appendChild(bubble);
            msgRow.appendChild(avatar);
            msgRow.appendChild(content);
            D.messages.appendChild(msgRow);

            const botMsg = { role: 'bot', content: text };
            sess.messages.push(botMsg);
            scrollBottom();
        }

        /* ── Upload event listeners ── */

        // Paperclip button → open file picker
        D.uploadBtn.onclick = (e) => {
            e.preventDefault();
            D.fileInput.click();
        };

        // File selected via picker
        D.fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) uploadFile(file);
        };

        /* ── Drag-and-drop ── */
        let dragCounter = 0;
        const mainContent = document.getElementById('main-content');

        mainContent.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            if (dragCounter === 1) D.dropOverlay.classList.add('active');
        });

        mainContent.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter <= 0) {
                dragCounter = 0;
                D.dropOverlay.classList.remove('active');
            }
        });

        mainContent.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
        });

        mainContent.addEventListener('drop', (e) => {
            e.preventDefault();
            dragCounter = 0;
            D.dropOverlay.classList.remove('active');
            const file = e.dataTransfer.files[0];
            if (file) uploadFile(file);
        });

        /* --- INIT --- */
        newSession();
        // ROOT FIX: Only auto-focus on desktop — on mobile this would open
        // the keyboard immediately on page load, which is bad UX.
        if (window.innerWidth > 768) {
            D.input.focus();
        }

    </script>
</body>
</html>
