<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           DESIGN TOKENS  (unchanged from original)
        ============================================================ */
        :root {
            --bg-main: radial-gradient(circle at center, #1a2238 0%, #0b0f1a 60%, #05070f 100%);
            --sidebar-bg: #020617;
            --sidebar-hover: #0f172a;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --input-bg: #0f172a;
            --input-border: #1f2937;
            --input-focus: rgba(34, 197, 94, 0.2);
            --bubble-user: #1e293b;
            --bubble-bot: #111827;
            --bubble-border: #1f2937;
            --sidebar-width: 260px;
            --radius-md: 12px;
            --radius-lg: 14px;
            --radius-bubble: 18px;
            --transition: all 0.2s ease;
        }

        /* ============================================================
           RESET
        ============================================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ============================================================
           BASE LAYOUT  —  full-height flex row
        ============================================================ */
        html, body {
            height: 100%;
            /* Use dvh where supported so mobile browser chrome doesn't clip */
            height: 100dvh;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            overflow: hidden;
            /* Prevent body from ever scrolling horizontally */
            max-width: 100vw;
            transition: var(--transition);
        }

        /* ============================================================
           SIDEBAR
        ============================================================ */
        #sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--bubble-border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            padding: 16px;
            z-index: 200;
            /* allow sidebar contents to be clipped, never overflow body */
            overflow: hidden;
        }

        .app-name {
            font-size: 18px;
            font-weight: 700;
            padding: 12px;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            /* prevent long names from pushing layout */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--bubble-border);
            background-color: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            transition: var(--transition);
            margin-bottom: 24px;
            width: 100%;
            /* large enough tap target on mobile */
            min-height: 44px;
        }

        .new-chat-btn:hover {
            background-color: var(--sidebar-hover);
            border-color: var(--text-secondary);
            transform: translateY(-1px);
        }

        .history-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 8px 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            /* keep it from wrapping */
            white-space: nowrap;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            margin-top: 8px;
            /* thin custom scrollbar */
            scrollbar-width: thin;
            scrollbar-color: var(--bubble-border) transparent;
        }

        #chat-history::-webkit-scrollbar { width: 4px; }
        #chat-history::-webkit-scrollbar-track { background: transparent; }
        #chat-history::-webkit-scrollbar-thumb {
            background-color: var(--bubble-border);
            border-radius: 4px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            /* clip long titles cleanly */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: var(--transition);
            margin-bottom: 4px;
            /* comfortable tap target */
            min-height: 40px;
            display: flex;
            align-items: center;
        }

        .history-item:hover {
            background-color: var(--sidebar-hover);
            color: var(--text-primary);
            transform: translateX(4px);
        }

        .history-item.active {
            background-color: var(--sidebar-hover);
            color: var(--text-primary);
            border: 1px solid var(--bubble-border);
        }

        /* ============================================================
           SIDEBAR OVERLAY  (darkens main area when sidebar is open on mobile)
        ============================================================ */
        #sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 150;
            /* fade-in animation */
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        #sidebar-overlay.visible {
            opacity: 1;
        }

        /* ============================================================
           MAIN CONTENT AREA
        ============================================================ */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            /* never let the main area overflow the viewport width */
            min-width: 0;
            overflow: hidden;
        }

        /* ============================================================
           WELCOME SCREEN
        ============================================================ */
        #welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .welcome-title {
            font-size: clamp(22px, 4vw, 36px);
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
            letter-spacing: -1px;
        }

        .welcome-sub {
            font-size: clamp(14px, 2vw, 16px);
            color: var(--text-secondary);
            max-width: 400px;
            line-height: 1.5;
        }

        /* ============================================================
           CHAT MESSAGES AREA
        ============================================================ */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 32px 0;
            display: none;
            /* thin custom scrollbar */
            scrollbar-width: thin;
            scrollbar-color: var(--bubble-border) transparent;
        }

        #chat-container::-webkit-scrollbar { width: 4px; }
        #chat-container::-webkit-scrollbar-track { background: transparent; }
        #chat-container::-webkit-scrollbar-thumb {
            background-color: var(--bubble-border);
            border-radius: 4px;
        }

        #messages {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ============================================================
           MESSAGE ROWS
        ============================================================ */
        .message {
            display: flex;
            gap: 14px;
            /* clamp gap on small screens */
            animation: fadeIn 0.35s ease forwards;
            /* never overflow horizontally */
            min-width: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0);   }
        }

        .message .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 11px;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .message.bot .avatar  { background-color: var(--accent);  color: #052e16; }
        .message.user .avatar { background-color: #334155; color: #f1f5f9;  }

        .message.user { flex-direction: row-reverse; }

        .msg-content {
            /* allow shrink — critical so bubbles don't overflow viewport */
            min-width: 0;
            max-width: 80%;
            line-height: 1.6;
            font-size: 15px;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: var(--radius-bubble);
            border: 1px solid var(--bubble-border);
            transition: var(--transition);
            /* always wrap, never overflow */
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .bubble:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .message.user .bubble {
            background-color: var(--bubble-user);
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
        }

        .message.bot .bubble {
            background-color: var(--bubble-bot);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        /* Code blocks inside bubbles — scrollable horizontally, clipped vertically */
        .bubble pre {
            overflow-x: auto;
            max-width: 100%;
            /* enable touch-scroll on iOS */
            -webkit-overflow-scrolling: touch;
        }

        /* ============================================================
           TYPING INDICATOR
        ============================================================ */
        #typing {
            display: none;
            padding: 8px 24px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            color: var(--text-secondary);
            font-size: 13px;
            font-style: italic;
        }

        /* ============================================================
           INPUT AREA
        ============================================================ */
        #input-area {
            /* never shrink — stays pinned at bottom */
            flex-shrink: 0;
            padding: 16px 24px;
            /* safe-area bottom for iPhone notch / home indicator */
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            background: linear-gradient(to top, var(--sidebar-bg) 60%, transparent);
        }

        .input-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-lg);
            padding: 10px 14px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            transition: var(--transition);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .input-container:hover,
        .input-container:focus-within {
            border-color: var(--text-secondary);
            box-shadow: 0 0 0 1px var(--input-focus), 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        textarea {
            flex: 1;
            /* prevent textarea from breaking the flex row */
            min-width: 0;
            background: none;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            resize: none;
            max-height: 160px;
            min-height: 24px;
            outline: none;
            padding: 4px 0;
            line-height: 1.5;
            /* prevent iOS auto-zoom (font < 16px triggers zoom) */
            font-size: max(16px, 15px);
        }

        textarea::placeholder { color: var(--text-secondary); }

        textarea:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #send-btn {
            flex-shrink: 0;
            background-color: var(--accent);
            color: #052e16;
            border: none;
            border-radius: 8px;
            /* slightly larger for easier tapping */
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0.3;
            pointer-events: none;
        }

        #send-btn.active            { opacity: 1; pointer-events: all; }
        #send-btn.active:hover      { background-color: var(--accent-hover); transform: scale(1.05); }

        /* ============================================================
           ICONS
        ============================================================ */
        svg {
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ============================================================
           MOBILE HAMBURGER TOGGLE
        ============================================================ */
        .menu-toggle {
            display: none;
            position: absolute;
            top: 14px;
            left: 14px;
            background-color: var(--bubble-user);
            border: 1px solid var(--bubble-border);
            color: var(--text-primary);
            border-radius: 8px;
            width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 300;
            transition: var(--transition);
            /* accessible touch target */
            touch-action: manipulation;
        }

        .menu-toggle:hover { background-color: var(--sidebar-hover); }

        /* ============================================================
           BREAKPOINT: LARGE DESKTOP  ≥ 1280px
           Centre the chat and cap bubble width comfortably.
        ============================================================ */
        @media (min-width: 1280px) {
            #messages {
                max-width: 860px;
                gap: 28px;
            }
            .msg-content { max-width: 75%; }
        }

        /* ============================================================
           BREAKPOINT: TABLET  769px – 1024px
        ============================================================ */
        @media (max-width: 1024px) and (min-width: 769px) {
            :root { --sidebar-width: 220px; }

            #messages {
                padding: 0 20px;
                gap: 20px;
            }

            .msg-content {
                max-width: 82%;
                font-size: 14px;
            }

            .welcome-title { font-size: 28px; }

            #input-area { padding: 14px 16px; }
        }

        /* ============================================================
           BREAKPOINT: MOBILE  ≤ 768px
        ============================================================ */
        @media (max-width: 768px) {
            /* Show hamburger */
            .menu-toggle { display: flex; }

            /* Sidebar slides in from left, off-screen by default */
            #sidebar {
                position: fixed;
                left: -100%;
                top: 0;
                bottom: 0;
                height: 100%;
                width: min(var(--sidebar-width), 80vw);
                transition: left 0.28s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 10px 0 40px rgba(0, 0, 0, 0.6);
                /* safe-area for left edge on notch devices */
                padding-left: max(16px, env(safe-area-inset-left));
            }

            #sidebar.open {
                left: 0;
            }

            /* Show overlay when sidebar is open */
            #sidebar-overlay {
                display: block;
            }

            /* Push main content down to clear hamburger */
            #main-content {
                padding-top: 64px;
                width: 100%;
            }

            /* Welcome screen compact */
            .welcome-title { font-size: 24px; }
            .welcome-sub   { font-size: 14px; }

            /* Chat area adjustments */
            #chat-container { padding: 16px 0; }

            #messages {
                padding: 0 12px;
                gap: 16px;
            }

            /* Bubbles take more width, smaller avatars */
            .message       { gap: 10px; }
            .message .avatar {
                width: 28px;
                height: 28px;
                font-size: 10px;
            }
            .msg-content {
                max-width: 88%;
                font-size: 14px;
            }
            .bubble { padding: 10px 14px; }

            /* Input area — flush to bottom with safe-area */
            #input-area {
                padding: 10px 12px;
                padding-bottom: max(10px, env(safe-area-inset-bottom));
            }

            .input-container { margin: 0; }

            textarea { font-size: 16px; /* 16px prevents iOS zoom */ }
        }

        /* ============================================================
           BREAKPOINT: SMALL MOBILE  ≤ 480px
        ============================================================ */
        @media (max-width: 480px) {
            .welcome-title  { font-size: 20px; letter-spacing: -0.5px; }
            .welcome-sub    { font-size: 13px; }

            #messages       { padding: 0 10px; gap: 14px; }

            .message        { gap: 8px; }
            .message .avatar {
                width: 26px;
                height: 26px;
                font-size: 9px;
                border-radius: 6px;
            }
            .msg-content    { max-width: 92%; font-size: 13.5px; }
            .bubble         { padding: 9px 12px; }

            #input-area     { padding: 8px 10px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
            #send-btn       { width: 34px; height: 34px; }

            /* Code blocks — scroll rather than overflow */
            .bubble pre {
                max-width: calc(100vw - 80px);
            }
        }
    </style>
</head>
<body>

    <!-- Mobile sidebar backdrop overlay -->
    <div id="sidebar-overlay" aria-hidden="true"></div>

    <aside id="sidebar" role="navigation" aria-label="Chat sessions">
        <div class="app-name">Assistant</div>
        <button type="button" class="new-chat-btn" id="new-chat-btn">
            <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            New Chat
        </button>
        <div class="history-label">History</div>
        <div id="chat-history"></div>
    </aside>

    <main id="main-content">
        <button id="menu-toggle" class="menu-toggle" aria-label="Toggle Sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <div id="welcome-screen">
            <h1 class="welcome-title">What would you like to know?</h1>
            <p class="welcome-sub">Ask anything, your AI assistant is ready.</p>
        </div>

        <div id="chat-container">
            <div id="messages"></div>
            <div id="typing">AI is thinking...</div>
        </div>

        <div id="input-area">
            <div class="input-container">
                <textarea id="user-input" rows="1" placeholder="Ask anything..." autocomplete="off" autocorrect="off" spellcheck="true"></textarea>
                <button id="send-btn" aria-label="Send message">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        'use strict';

        const S = {
            sessions: [],
            activeId: null
        };

        const $ = id => document.getElementById(id);
        const D = {
            history: $('chat-history'),
            welcome: $('welcome-screen'),
            chatContainer: $('chat-container'),
            messages: $('messages'),
            input: $('user-input'),
            sendBtn: $('send-btn'),
            newBtn: $('new-chat-btn'),
            typing: $('typing')
        };

        /* --- UTILS --- */
        const uid = () => Math.random().toString(36).slice(2, 9);
        
        function scrollBottom() {
            setTimeout(() => {
                D.chatContainer.scrollTop = D.chatContainer.scrollHeight;
            }, 50);
        }

        const getApiUrl = () => {
            if (window.location.origin && window.location.origin !== 'null' && window.location.protocol.startsWith('http')) {
                return `${window.location.origin}/chat`;
            }
            return 'http://localhost:8000/chat';
        };

        function formatMarkdown(text) {
            // Escape HTML for XSS prevention
            let html = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

            // Code blocks
            html = html.replace(/```([\s\S]*?)```/g, (match, p1) => {
                const lines = p1.split('\n');
                let code = p1;
                let lang = '';
                if (lines.length > 0 && !lines[0].includes(' ') && lines[0].trim().length < 15) {
                    lang = lines[0].trim();
                    code = lines.slice(1).join('\n');
                }
                return `<pre style="background: #090d16; padding: 12px; border-radius: 6px; overflow-x: auto; border: 1px solid var(--bubble-border); font-family: monospace; font-size: 13px; margin: 8px 0; color: #34d399;"><code class="${lang}">${code.trim()}</code></pre>`;
            });

            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code style="background: #090d16; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #34d399;">$1</code>');

            // Line breaks
            html = html.replace(/\n/g, '<br>');

            return html;
        }

        function updateInputState(loading) {
            if (loading) {
                D.input.disabled = true;
                D.sendBtn.classList.remove('active');
                D.sendBtn.style.pointerEvents = 'none';
            } else {
                D.input.disabled = false;
                D.input.focus();
                D.sendBtn.classList.toggle('active', D.input.value.trim().length > 0);
                D.sendBtn.style.pointerEvents = D.input.value.trim().length > 0 ? 'all' : 'none';
            }
        }

        /* --- SESSIONS --- */
        function newSession() {
            // BUG 1 FIX: Re-use current active session if it is empty.
            // Guard must also call renderHistory() to fix stale active-highlight (BUG 5).
            const activeSess = S.sessions.find(s => s.id === S.activeId);
            if (activeSess && activeSess.messages.length === 0 && !activeSess.isLoading) {
                D.input.value = '';
                D.input.style.height = 'auto';
                D.input.focus();
                D.sendBtn.classList.remove('active');
                renderHistory(); // BUG 5 FIX: ensure sidebar active-highlight is correct
                return;
            }

            const sess = { id: uid(), title: 'New Chat', messages: [], isLoading: false };
            S.sessions.unshift(sess);

            // BUG 1 FIX: Set S.activeId atomically BEFORE activateSession so any
            // in-flight sendMessage() closures that re-check S.activeId see the correct value.
            S.activeId = sess.id;

            // Clear input box state cleanly
            D.input.value = '';
            D.input.style.height = 'auto';
            D.sendBtn.classList.remove('active');

            activateSession(sess.id);
        }

        function activateSession(id) {
            S.activeId = id;
            const sess = S.sessions.find(s => s.id === id);
            if (!sess) return;

            // BUG 6 FIX: Always clear the messages DOM before switching sessions
            // to prevent stale nodes from the previous session being visible.
            D.messages.innerHTML = '';

            if (sess.messages.length === 0) {
                D.welcome.style.display = 'flex';
                D.chatContainer.style.display = 'none';
            } else {
                D.welcome.style.display = 'none';
                D.chatContainer.style.display = 'block';
                renderMessages(sess.messages);
            }

            // Clear input box to avoid stale content leakage across sessions (BUG 4)
            D.input.value = '';
            D.input.style.height = 'auto';
            D.sendBtn.classList.remove('active');

            D.typing.style.display = sess.isLoading ? 'block' : 'none';
            updateInputState(sess.isLoading);
            renderHistory();
        }

        function renderHistory() {
            D.history.innerHTML = '';
            S.sessions.forEach(s => {
                const el = document.createElement('div');
                el.className = `history-item ${s.id === S.activeId ? 'active' : ''}`;
                el.textContent = s.title;
                el.onclick = () => {
                    activateSession(s.id);
                    if (window.innerWidth <= 768) {
                        $('sidebar').classList.remove('open');
                    }
                };
                D.history.appendChild(el);
            });
        }

        /* --- MESSAGES --- */
        function renderMessages(messages) {
            D.messages.innerHTML = '';
            messages.forEach(m => appendMessageUI(m));
            scrollBottom();
        }

        function appendMessageUI(m) {
            const msgRow = document.createElement('div');
            msgRow.className = `message ${m.role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = m.role === 'user' ? 'U' : 'AI';

            const content = document.createElement('div');
            content.className = 'msg-content';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            if (m.role === 'bot' && m.content.startsWith('Error:')) {
                // Render error messages beautifully using a reddish accent
                bubble.style.borderColor = '#ef4444';
                bubble.style.backgroundColor = '#180f15';
                bubble.innerHTML = `<span style="color: #f87171; font-weight: 500;">${formatMarkdown(m.content)}</span>`;
            } else {
                bubble.innerHTML = formatMarkdown(m.content);
            }

            content.appendChild(bubble);
            msgRow.appendChild(avatar);
            msgRow.appendChild(content);
            D.messages.appendChild(msgRow);
        }

        async function sendMessage() {
            const text = D.input.value.trim();
            if (!text) return;

            // BUG 1 FIX: Snapshot activeId at the START of this call.
            // All checks against the session must use this snapshot, not a live S.activeId,
            // so a concurrent newSession() cannot redirect this message to the wrong session.
            const sendingSessionId = S.activeId;
            const sess = S.sessions.find(s => s.id === sendingSessionId);
            if (!sess || sess.isLoading) return;

            // BUG 6 FIX: If this is the first message, show chat container BEFORE
            // appending to DOM. Also use renderMessages() to avoid double-render.
            const isFirstMessage = sess.messages.length === 0;
            if (isFirstMessage) {
                sess.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
                D.welcome.style.display = 'none';
                D.chatContainer.style.display = 'block';
                D.messages.innerHTML = ''; // clear stale DOM
                renderHistory(); // update sidebar title immediately
            }

            const uMsg = { role: 'user', content: text };
            sess.messages.push(uMsg);

            // Only update DOM if this session is still active
            if (S.activeId === sendingSessionId) {
                appendMessageUI(uMsg);
            }

            D.input.value = '';
            D.input.style.height = 'auto';
            D.sendBtn.classList.remove('active');

            sess.isLoading = true;
            if (S.activeId === sendingSessionId) {
                D.typing.style.display = 'block';
                updateInputState(true);
                scrollBottom();
            }

            try {
                const response = await fetch(getApiUrl(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        session_id: sess.id  // always use sess.id, not S.activeId
                    })
                });

                if (!response.ok) {
                    const errRes = await response.json().catch(() => ({}));
                    throw new Error(errRes.detail || `Server returned status ${response.status}`);
                }

                const data = await response.json();
                const replyText = data.reply || "I'm sorry, I couldn't process that.";
                const bMsg = { role: 'bot', content: replyText };
                sess.messages.push(bMsg);

                // BUG 6 FIX: Only update DOM if the user hasn't switched away.
                // If they switched away and back, activateSession already rendered the history.
                if (S.activeId === sendingSessionId) {
                    D.typing.style.display = 'none';
                    appendMessageUI(bMsg);
                    scrollBottom();
                }
            } catch (e) {
                const errorText = e.message || "Error connecting to server. Please ensure the backend is running.";
                const eMsg = { role: 'bot', content: `Error: ${errorText}` };
                sess.messages.push(eMsg);

                if (S.activeId === sendingSessionId) {
                    D.typing.style.display = 'none';
                    appendMessageUI(eMsg);
                    scrollBottom();
                }
            } finally {
                sess.isLoading = false;
                if (S.activeId === sendingSessionId) {
                    updateInputState(false);
                }
            }
        }

        /* --- LISTENERS --- */
        D.input.oninput = () => {
            D.input.style.height = 'auto';
            // cap matches CSS max-height: 160px
            D.input.style.height = Math.min(D.input.scrollHeight, 160) + 'px';
            D.sendBtn.classList.toggle('active', D.input.value.trim().length > 0);
        };

        D.input.onkeydown = (e) => { 
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                sendMessage(); 
            } 
        };

        D.sendBtn.onclick = sendMessage;
        D.newBtn.onclick = newSession;

        // Helper: open / close sidebar with overlay animation
        function openSidebar() {
            const sidebar = $('sidebar');
            const overlay = $('sidebar-overlay');
            sidebar.classList.add('open');
            // Trigger overlay fade-in on next frame
            requestAnimationFrame(() => overlay.classList.add('visible'));
        }

        function closeSidebar() {
            const sidebar = $('sidebar');
            const overlay = $('sidebar-overlay');
            sidebar.classList.remove('open');
            overlay.classList.remove('visible');
        }

        // Mobile hamburger toggle
        $('menu-toggle').onclick = (e) => {
            e.stopPropagation();
            const isOpen = $('sidebar').classList.contains('open');
            isOpen ? closeSidebar() : openSidebar();
        };

        // Tapping the overlay closes the sidebar
        $('sidebar-overlay').onclick = () => closeSidebar();

        // Close mobile sidebar when clicking main screen (desktop fallback)
        document.body.onclick = (e) => {
            if (window.innerWidth <= 768) {
                const sidebar = $('sidebar');
                const toggle = $('menu-toggle');
                const overlay = $('sidebar-overlay');
                if (
                    !sidebar.contains(e.target) &&
                    e.target !== toggle &&
                    !toggle.contains(e.target) &&
                    e.target !== overlay
                ) {
                    closeSidebar();
                }
            }
        };

        /* --- INIT --- */
        newSession();
        D.input.focus();

    </script>
</body>
</html>
